<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mangiamo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mangiamo">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#eff6ff;--card:#fff;--tx:#1e293b;--mut:#64748b;--pri:#3b82f6;--bd:#e2e8f0;--soft:#e0ecff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1426;--card:#14213a;--tx:#e5e7eb;--mut:#94a3b8;--bd:#223356;--soft:#1b2c4d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100vw}
body{overflow-x:hidden;max-width:100vw}
main,.card,.tf,.sub,.profs{max-width:100%}
img,canvas{max-width:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 8px}
.profs{display:flex;gap:6px;flex-wrap:wrap}
.pf{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.pf.on{color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar button,.btn,.sub button,.tf button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.btn{margin:0 6px 8px 0}
.day{padding:10px 12px}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.dn{font-weight:800;font-size:14px;margin-bottom:6px}
.slot{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--bd)}
.sl{width:70px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--mut);flex:none}
.sn{flex:1;font-size:14px;cursor:pointer}
.ic{border:none;background:var(--soft);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--tx)}
.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.pb{display:inline-block;color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;margin-right:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tf,.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tf button.on,.sub button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=text],input[type=password]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:10px}
.meal{cursor:pointer}
.meal b{display:block;margin-bottom:4px;font-size:15px}
.mut{color:var(--mut);font-size:12px}
.cat{font-weight:800;font-size:13px;margin:12px 0 4px}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:15px}
.it.done span{text-decoration:line-through;color:var(--mut)}
.it input{width:20px;height:20px;accent-color:var(--pri)}
.it .q{margin-left:auto;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;border:none;background:none;color:var(--mut);padding:10px 0 8px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:800}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.show{display:flex}
#mbox{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.wheelwrap{position:relative;max-width:320px;margin:0 auto 10px}
.wheelwrap canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #dc2626;z-index:2}
.res{text-align:center}
.ok{color:#15803d;font-weight:700}
details{font-size:13px;color:var(--mut);margin-bottom:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hrow h1{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;margin:8px 0;font-family:inherit}
#wstoast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
#wstoast.show{opacity:1}

/* ---------- diseño amable y minimalista (v2) ---------- */
:root{--bg:#eff6ff;--card:#fff;--tx:#1e293b;--mut:#64748b;--pri:#3b82f6;--bd:#dbe7fb;--soft:#e2edff;--tint:#dbeafe;--sh:0 1px 2px rgba(30,64,175,.05),0 6px 20px rgba(30,64,175,.08);--r:20px}
@media(prefers-color-scheme:dark){:root{--bg:#0b1426;--card:#14213a;--tx:#e8ecf1;--mut:#97a3b4;--bd:#223356;--soft:#1b2c4d;--tint:#172a52;--sh:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.28)}}
body{font-size:16px;line-height:1.35;padding-bottom:96px}
header{border-bottom:0;box-shadow:0 1px 0 var(--bd);padding:12px 16px 10px}
h1{font-size:19px;letter-spacing:-.01em;margin:0 0 10px}
.profs{gap:8px}
.pf{border:0!important;background:var(--soft);color:var(--tx);padding:8px 16px;font-size:15px;border-radius:999px;transition:transform .12s}
.pf:active{transform:scale(.96)}
.pf.on{color:#fff}
main{padding:16px}
.card{border:0;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.bar{margin-bottom:14px}
.bar b{font-size:17px}
.bar button,.btn,.sub button,.tf button{border:0;background:var(--soft);border-radius:14px;padding:11px 16px;font-size:15px;font-weight:600;transition:transform .12s}
.bar button:active,.btn:active,.tf button:active,.ic:active{transform:scale(.96)}
.btn{margin:0 8px 10px 0}
.btn.pri,.tf button.on,.sub button.on{background:var(--pri);color:#fff}
.btn[disabled]{opacity:.55}
.day{padding:16px}
.day.today{background:var(--tint);box-shadow:var(--sh);position:relative}
.day.today::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--pri)}
.dn{font-size:16px;margin-bottom:8px}
.slot{border-top:0;padding:8px 0;gap:10px}
.sl{width:78px;font-size:11px;letter-spacing:.04em;font-weight:700}
.sn{font-size:15px}
.ic{min-width:38px;height:38px;border-radius:12px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:var(--soft);flex:none}
.warn{border-radius:14px;padding:12px 14px;font-size:14px}
.pb{border-radius:8px;font-size:10px;font-weight:700;padding:2px 7px;opacity:.9}
.chip{border:0;background:var(--soft);padding:8px 14px;font-size:14px}
input[type=text],input[type=password],select{border:0;background:var(--soft);border-radius:14px;padding:13px 14px;font-size:16px;color:var(--tx)}
select{padding:9px 12px;font-size:15px}
input[type=text]:focus,input[type=password]:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0}
textarea{border:0;background:var(--soft);border-radius:14px;padding:13px 14px}
.meal b{font-size:16px;font-weight:700;margin-bottom:6px;padding-right:4px}
.mut{font-size:13px}
.cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 6px}
.it{border-bottom:0;padding:10px 0;font-size:16px}
.it input{width:24px;height:24px;border-radius:50%}
.it .q{font-weight:600;color:var(--mut)}
.it.done .q{opacity:.6}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:0;border-radius:24px;box-shadow:0 8px 30px rgba(15,23,42,.18);padding:6px;gap:4px;max-width:520px;margin:0 auto}
nav button{border-radius:18px;padding:8px 0 6px;font-size:11px;font-weight:600;transition:background .15s}
nav button span{font-size:21px;margin-bottom:2px}
nav button.on{background:var(--tint);color:var(--pri)}
#modal{background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#mbox{border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
#mbox::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--bd);margin:-12px auto 14px}
details{font-size:14px;margin:12px 0}
summary{cursor:pointer;padding:6px 0}
#wstoast{bottom:104px}
#bkbar{bottom:calc(92px + env(safe-area-inset-bottom))!important;border-radius:18px!important}
.tf,.sub{gap:8px}
.tf button,.sub button{padding:9px 14px;font-size:14px}
.it input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:transparent;flex:none;display:inline-grid;place-content:center;margin:0;cursor:pointer;opacity:.9}
.it input[type=checkbox]:checked{background:var(--pri);border-color:var(--pri);opacity:1}
.it input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.it input[type=checkbox]:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- asistente (wizard) ---------- */
#wz{position:fixed;left:0;top:0;right:0;bottom:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;padding:16px 20px calc(16px + env(safe-area-inset-bottom))}
.wz-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.wz-top button{width:34px;height:34px;border:none;background:none;color:var(--mut);font-size:22px;cursor:pointer;border-radius:10px;padding:0}
.wz-top button:active{background:var(--soft)}
.wz-sp{width:34px;height:34px;flex:none}
.wz-prog{display:flex;gap:4px;flex:1}
.wz-prog i{flex:1;height:6px;border-radius:99px;background:var(--bd);transition:background .4s}
.wz-prog i.on{background:var(--pri)}
.wz-body{flex:1;overflow-y:auto;max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
.wz-in{margin:auto 0;width:100%;text-align:center;padding:4px 0 24px;animation:wzIn .35s ease both}
.wz-same .wz-in{animation:none}
@keyframes wzIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.wz-in{animation:none}.wz-prog i{transition:none}}
.wz-in h1{font-size:30px;font-weight:900;margin:14px 0 8px;letter-spacing:-.5px}
.wz-in h2{font-size:24px;font-weight:800;margin:0 0 8px}
.wz-p{color:var(--mut);font-size:15px;line-height:1.5;margin:0 0 18px}
.wz-logo{width:92px;height:92px;border-radius:30px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto;box-shadow:0 12px 30px rgba(59,130,246,.28)}
.wz-note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;text-align:left;margin:0 0 14px}
.wz-input{width:100%;padding:16px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;font-weight:700;text-align:center;font-family:inherit}
.wz-input:focus{outline:none;border-color:var(--pri)}
.wz-err{color:#dc2626;font-size:13px;min-height:20px;margin-top:8px}
.wz-sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.wz-pill{border:2px solid var(--bd);background:var(--card);color:var(--mut);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.wz-list{margin-bottom:6px}
.wz-chip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;font-family:inherit;transition:transform .1s,border-color .2s,background .2s}
.wz-chip:active{transform:scale(.98)}
.wz-chip[disabled]{opacity:.45;cursor:default}
.wz-chip[aria-pressed=true]{border-color:var(--pri);background:rgba(59,130,246,.1)}
.wz-chip small{display:block;font-weight:500;font-size:12px;line-height:1.35;color:var(--mut);margin-top:2px}
.wz-em{font-size:26px;flex:none;width:34px;text-align:center}
.wz-ck{margin-left:auto;font-size:18px;color:var(--pri);opacity:0;flex:none}
.wz-chip[aria-pressed=true] .wz-ck{opacity:1}
.wz-info{color:var(--tx);font-size:14px;font-weight:700;min-height:42px;margin:0 0 12px}
.wz-fine{color:var(--mut);font-size:12px;line-height:1.4;text-align:center;margin:0 0 8px}
.wz-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px;text-align:left}
.wz-row small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.wz-foot{margin-top:12px;max-width:440px;width:100%;align-self:center;min-height:56px}
.wz-go{width:100%;padding:16px;border:none;border-radius:16px;background:var(--pri);color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(59,130,246,.25)}
.wz-go:active{transform:scale(.98)}
.wz-go:disabled{background:var(--soft);color:var(--mut);box-shadow:none;cursor:default}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1 id="ttl">🥑 Mangiamo</h1><button class="ic" id="gear" onclick="openSettings()" aria-label="Ajustes">⚙️</button></div>
  <div class="profs" id="profs"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="mbox"></div></div>

<script src="store.js"></script>
<script>
/* La app arranca recién cuando el almacenamiento cifrado está listo (y desbloqueado, si tiene contraseña). */
(function(){
  function load(src){return new Promise(function(ok,fail){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){fail(new Error(src));};document.body.appendChild(s);});}
  Vault.ready.then(function(){return load('data.js');}).then(function(){return load('diets.js');}).then(function(){return load('workspace.js');}).then(function(){return load('wizard.js');}).then(function(){return load('backup.js');}).then(function(){return load('legal.js');}).then(function(){return load('apoyo.js');}).then(function(){return load('app.js');})
  .catch(function(e){document.getElementById('main').innerHTML='<div class="card"><b>No se pudo abrir la app</b><div style="margin-top:6px;font-size:14px">Falló la carga de '+String(e.message||e)+'. Revisá tu conexión y recargá la página.</div></div>';});
})();
</script>
</body>
</html>
